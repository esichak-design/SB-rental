<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" role="img" aria-label="Hero — sunset from the balcony placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6c99a"/>
      <stop offset="55%" stop-color="#e8956a"/>
      <stop offset="100%" stop-color="#b45f52"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b5d6b"/>
      <stop offset="100%" stop-color="#173f4c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fff0d0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff0d0" stop-opacity="0"/>
    </radialGradient>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="t">
      <feFuncA type="linear" slope="0.055"/>
    </feComponentTransfer>
    <feComposite operator="over" in="t" in2="SourceGraphic"/>
  </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="2400" height="837" fill="url(#sky)"/>
    <circle cx="1632.0000000000002" cy="702" r="101.25" fill="#fff6e4" opacity="0.75"/>
       <ellipse cx="1632.0000000000002" cy="702" rx="270" ry="270" fill="url(#glow)"/>
    <rect y="837" width="2400" height="513" fill="url(#sea)"/>
    <rect y="835" width="2400" height="3" fill="#ffffff" opacity="0.22"/>
  </g>
  
  <g opacity="0.85">
    <rect x="807" y="271" width="787" height="107" rx="54" fill="rgba(0,0,0,0.22)"/>
    <text x="1200" y="324.5" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, Helvetica, Arial, sans-serif" font-size="41"
          font-weight="500" letter-spacing="0.8200000000000001" fill="#ffffff">Hero — sunset from the balcony</text>
  </g>
</svg>
