<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1500" width="2000" height="1500" role="img" aria-label="Community pool placeholder">
  <defs>
    <linearGradient id="wall" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#dcecef"/>
      <stop offset="100%" stop-color="#8dbcc6"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="t">
      <feFuncA type="linear" slope="0.055"/>
    </feComponentTransfer>
    <feComposite operator="over" in="t" in2="SourceGraphic"/>
  </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="2000" height="1500" fill="url(#wall)"/>
    <rect x="1160" y="180" width="600" height="750" rx="12" fill="#5e97a4" opacity="0.3"/>
    <rect x="120" y="990" width="920" height="300" rx="20" fill="#5e97a4" opacity="0.35"/>
    <rect width="2000" height="1500" fill="url(#light)"/>
  </g>
  
  <g opacity="0.85">
    <rect x="770" y="302" width="461" height="117" rx="59" fill="rgba(255,255,255,0.45)"/>
    <text x="1000" y="360.5" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, Helvetica, Arial, sans-serif" font-size="45"
          font-weight="500" letter-spacing="0.9" fill="#16212c">Community pool</text>
  </g>
</svg>
