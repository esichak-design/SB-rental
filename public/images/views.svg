<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1500" width="2000" height="1500" role="img" aria-label="Ocean views placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe2ea"/>
      <stop offset="55%" stop-color="#9dc0cf"/>
      <stop offset="100%" stop-color="#7aa5b6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6879"/>
      <stop offset="100%" stop-color="#1a4553"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fff0d0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff0d0" stop-opacity="0"/>
    </radialGradient>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="t">
      <feFuncA type="linear" slope="0.055"/>
    </feComponentTransfer>
    <feComposite operator="over" in="t" in2="SourceGraphic"/>
  </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="2000" height="750" fill="url(#sky)"/>
    
    <rect y="750" width="2000" height="750" fill="url(#sea)"/>
    <rect y="748" width="2000" height="3" fill="#ffffff" opacity="0.22"/>
  </g>
  
  <g opacity="0.85">
    <rect x="808" y="302" width="385" height="117" rx="59" fill="rgba(0,0,0,0.22)"/>
    <text x="1000" y="360.5" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, Helvetica, Arial, sans-serif" font-size="45"
          font-weight="500" letter-spacing="0.9" fill="#ffffff">Ocean views</text>
  </g>
</svg>
