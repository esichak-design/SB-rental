<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2000" width="1500" height="2000" role="img" aria-label="Beach placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceaef"/>
      <stop offset="55%" stop-color="#a8cbd5"/>
      <stop offset="100%" stop-color="#e8dcc4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8896"/>
      <stop offset="100%" stop-color="#e3d6bd"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fff0d0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff0d0" stop-opacity="0"/>
    </radialGradient>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="t">
      <feFuncA type="linear" slope="0.055"/>
    </feComponentTransfer>
    <feComposite operator="over" in="t" in2="SourceGraphic"/>
  </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="1500" height="900" fill="url(#sky)"/>
    
    <rect y="900" width="1500" height="1100" fill="url(#sea)"/>
    <rect y="898" width="1500" height="3" fill="#ffffff" opacity="0.22"/>
  </g>
  
  <g opacity="0.85">
    <rect x="633" y="422" width="234" height="117" rx="59" fill="rgba(0,0,0,0.22)"/>
    <text x="750" y="480.5" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, Helvetica, Arial, sans-serif" font-size="45"
          font-weight="500" letter-spacing="0.9" fill="#ffffff">Beach</text>
  </g>
</svg>
