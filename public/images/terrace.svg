<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1500" width="2000" height="1500" role="img" aria-label="Outdoor space placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e8ee"/>
      <stop offset="55%" stop-color="#a6c8d4"/>
      <stop offset="100%" stop-color="#84aebc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#356d7a"/>
      <stop offset="100%" stop-color="#1e4b57"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fff0d0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff0d0" stop-opacity="0"/>
    </radialGradient>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="t">
      <feFuncA type="linear" slope="0.055"/>
    </feComponentTransfer>
    <feComposite operator="over" in="t" in2="SourceGraphic"/>
  </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="2000" height="870" fill="url(#sky)"/>
    
    <rect y="870" width="2000" height="630" fill="url(#sea)"/>
    <rect y="868" width="2000" height="3" fill="#ffffff" opacity="0.22"/>
  </g>
  
  <g opacity="0.85">
    <rect x="782" y="302" width="436" height="117" rx="59" fill="rgba(0,0,0,0.22)"/>
    <text x="1000" y="360.5" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, Helvetica, Arial, sans-serif" font-size="45"
          font-weight="500" letter-spacing="0.9" fill="#ffffff">Outdoor space</text>
  </g>
</svg>
