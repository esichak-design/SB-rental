<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2000" width="1500" height="2000" role="img" aria-label="Second bedroom placeholder">
  <defs>
    <linearGradient id="wall" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f4f1e9"/>
      <stop offset="100%" stop-color="#d7d2c6"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="t">
      <feFuncA type="linear" slope="0.055"/>
    </feComponentTransfer>
    <feComposite operator="over" in="t" in2="SourceGraphic"/>
  </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="1500" height="2000" fill="url(#wall)"/>
    <rect x="869.9999999999999" y="240" width="450" height="1000" rx="9" fill="#b7b1a2" opacity="0.3"/>
    <rect x="90" y="1320" width="690" height="400" rx="15" fill="#b7b1a2" opacity="0.35"/>
    <rect width="1500" height="2000" fill="url(#light)"/>
  </g>
  
  <g opacity="0.85">
    <rect x="520" y="422" width="461" height="117" rx="59" fill="rgba(255,255,255,0.45)"/>
    <text x="750" y="480.5" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, Helvetica, Arial, sans-serif" font-size="45"
          font-weight="500" letter-spacing="0.9" fill="#16212c">Second bedroom</text>
  </g>
</svg>
